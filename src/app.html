<!doctype html>
<html lang="en">
	<head>
		<script>
			// Resolve the theme before first paint: a saved choice wins, else the system preference.
			try {
				var t = localStorage.getItem('syncvotes.theme');
				if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
				document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		<meta charset="utf-8" />
		<!-- Syne for display, Inter for text, JetBrains Mono for labels, the serifs for accents. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&family=Syne:wght@600;700;800&display=swap"
			rel="stylesheet"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
