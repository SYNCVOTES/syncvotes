# Our services only. The Splice validator is a separate compose project managed by its own
# start.sh/stop.sh — those do more than `compose up` (they generate config and onboard), so a
# deploy here must never be able to recreate its containers. We only join its network.
name: syncvotes

services:
  app:
    build:
      context: .
      args:
        # Which commit this is — `pnpm deploy:*` sets it from git, and refuses an uncommitted tree.
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    environment:
      # SvelteKit refuses cross-origin POSTs without this.
      ORIGIN: https://${APP_DOMAIN:?set in .env}
      # The participant is on the validator's network; its JSON API needs no nginx in between.
      LEDGER_API_URL: http://participant:7575
      PROVIDER_PARTY: ${PROVIDER_PARTY:?set in the env file}
      OPERATOR_PARTY: ${OPERATOR_PARTY:?set in the env file}
      # The app is an OAuth client of the realm below; the participant checks its tokens' RS256
      # signature against the realm's keys and their audience against LEDGER_API_AUDIENCE.
      LEDGER_AUTH_URL: https://${APP_DOMAIN}/auth/realms/canton/.well-known/openid-configuration
      LEDGER_AUTH_CLIENT_ID: syncvotes-app
      LEDGER_AUTH_CLIENT_SECRET: ${KC_APP_SECRET:?set in the env file}
      LEDGER_AUTH_AUDIENCE: ${LEDGER_API_AUDIENCE:-https://canton.network.global}
      LEDGER_AUTH_SCOPE: daml_ledger_api
      # Shown to users; the ledger does not care.
      NETWORK: ${NETWORK:-TestNet}
      # A signed transaction that issues a hundred voting rights comes back as a ~1 MB request.
      BODY_SIZE_LIMIT: 8M
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      default: {}

  # The identity provider for the validator, its UIs and this app. Realm shape in keycloak/,
  # secrets from the env file. Served under /auth on the app's domain, so no second hostname.
  keycloak:
    build: ./keycloak
    restart: unless-stopped
    environment:
      KC_HOSTNAME: https://${APP_DOMAIN}/auth
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_DB_URL: jdbc:postgresql://keycloak-db/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set in the env file}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set in the env file}
      # Substituted into the realm on first import.
      LEDGER_API_AUDIENCE: ${LEDGER_API_AUDIENCE:-https://canton.network.global}
      VALIDATOR_AUDIENCE: ${VALIDATOR_AUDIENCE:?set in the env file}
      WALLET_UI_URL: ${WALLET_UI_URL:?set in the env file}
      CNS_UI_URL: ${CNS_UI_URL:?set in the env file}
      WALLET_USER_NAME: ${WALLET_USER_NAME:?set in the env file}
      KC_VALIDATOR_SECRET: ${KC_VALIDATOR_SECRET:?set in the env file}
      KC_APP_SECRET: ${KC_APP_SECRET}
      KC_VALIDATOR_USER_ID: ${KC_VALIDATOR_USER_ID:?set in the env file}
      KC_APP_USER_ID: ${KC_APP_USER_ID:?set in the env file}
      KC_WALLET_USER_ID: ${KC_WALLET_USER_ID:?set in the env file}
      KC_WALLET_USER_PASSWORD: ${KC_WALLET_USER_PASSWORD:?set in the env file}
    depends_on:
      - keycloak-db
    # The image has no curl; bash's /dev/tcp asks the management port whether the realm is served.
    healthcheck:
      test:
        - CMD-SHELL
        - exec 3<>/dev/tcp/localhost/9000 && printf 'GET /auth/health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      default: {}

  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    networks:
      default: {}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # The config travels as inline content: with a remote Docker host a bind mount would look
    # for the file on the server, where this tree does not exist. Compose interpolates the
    # domain into it before Caddy ever sees it.
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    # Bound to the public address on purpose: the validator's nginx already holds :80 on
    # loopback, and two processes cannot share a port on the same address.
    ports:
      - '${PUBLIC_IP:?set in the env file}:80:80'
      - '${PUBLIC_IP}:443:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

configs:
  caddyfile:
    # One public domain. The ledger API and the validator's admin UIs stay off the internet —
    # the bundle already binds them to loopback, so nothing here exposes them.
    content: |
      ${APP_DOMAIN:?set in the env file} {
        header Strict-Transport-Security "max-age=31536000; includeSubDomains"
        handle /auth/* {
          reverse_proxy keycloak:8080
        }
        handle {
          reverse_proxy app:3000
        }
      }

volumes:
  caddy-data:
  caddy-config:
  keycloak-db:

networks:
  default:
    name: ${VALIDATOR_NETWORK:-splice-validator_default}
    external: true
