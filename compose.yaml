# Our services only. The Splice validator is a separate compose project managed by its own
# start.sh/stop.sh — those do more than `compose up` (they generate config and onboard), so a
# deploy here must never be able to recreate its containers. We only join its network.
name: syncvotes

services:
  app:
    build:
      context: .
      args:
        # Which commit this is — `pnpm deploy:*` sets it from git, and refuses an uncommitted tree.
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    environment:
      # SvelteKit refuses cross-origin POSTs without this.
      ORIGIN: https://${APP_DOMAIN:?set in .env}
      # The participant is on the validator's network; its JSON API needs no nginx in between.
      LEDGER_API_URL: http://participant:7575
      PROVIDER_PARTY: ${PROVIDER_PARTY:?set in the env file}
      PAYEE_PARTY: ${PAYEE_PARTY:-}
      DEPOSITS_SINCE: ${DEPOSITS_SINCE:-}
      # The app is an OAuth client of the realm below; the participant checks its tokens' RS256
      # signature against the realm's keys and their audience against LEDGER_API_AUDIENCE.
      # The realm over the compose network: no trip through the public proxy for every token.
      LEDGER_AUTH_URL: http://keycloak:8080/auth/realms/canton/.well-known/openid-configuration
      LEDGER_AUTH_CLIENT_ID: syncvotes-app
      LEDGER_AUTH_CLIENT_SECRET: ${KC_APP_SECRET:?set in the env file}
      LEDGER_AUTH_AUDIENCE: ${LEDGER_API_AUDIENCE:-https://canton.network.global}
      LEDGER_AUTH_SCOPE: daml_ledger_api
      SCAN_URL: ${SCAN_URL:?set in the env file}
      BILLING_FACTOR: ${BILLING_FACTOR:-1}
      BILLING_FLOOR: ${BILLING_FLOOR:-0}
      MARKERS: ${MARKERS:-false}
      # Comma-separated invite codes; while any are set, sign-up needs one. Empty opens the door.
      INVITE_CODES: ${INVITE_CODES:-}
      # Shown to users; the ledger does not care.
      NETWORK: ${NETWORK:-TestNet}
      NETWORKS: ${NETWORKS:-}
      # Behind another proxy (traefik, nginx) the app is told so; see CADDY_* in the env file.
    labels:
      traefik.enable: 'false'
      # A signed transaction that issues a hundred voting rights comes back as a ~1 MB request.
      BODY_SIZE_LIMIT: 8M
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      default: {}

  # The identity provider for the validator, its UIs and this app. Realm shape in keycloak/,
  # secrets from the env file. Served under /auth on the app's domain, so no second hostname.
  keycloak:
    build: ./keycloak
    restart: unless-stopped
    environment:
      KC_HOSTNAME: https://${APP_DOMAIN}/auth
      # Discovery asked over the compose network answers with the compose network's addresses.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_DB_URL: jdbc:postgresql://keycloak-db/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set in the env file}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set in the env file}
      # Substituted into the realm on first import.
      LEDGER_API_AUDIENCE: ${LEDGER_API_AUDIENCE:-https://canton.network.global}
      VALIDATOR_AUDIENCE: ${VALIDATOR_AUDIENCE:?set in the env file}
      WALLET_UI_URL: ${WALLET_UI_URL:?set in the env file}
      CNS_UI_URL: ${CNS_UI_URL:?set in the env file}
      WALLET_USER_NAME: ${WALLET_USER_NAME:?set in the env file}
      KC_VALIDATOR_SECRET: ${KC_VALIDATOR_SECRET:?set in the env file}
      KC_APP_SECRET: ${KC_APP_SECRET}
      KC_VALIDATOR_USER_ID: ${KC_VALIDATOR_USER_ID:?set in the env file}
      KC_APP_USER_ID: ${KC_APP_USER_ID:?set in the env file}
      KC_WALLET_USER_ID: ${KC_WALLET_USER_ID:?set in the env file}
      KC_WALLET_USER_PASSWORD: ${KC_WALLET_USER_PASSWORD:?set in the env file}
    labels:
      traefik.enable: 'false'
    depends_on:
      - keycloak-db
    # The image has no curl; bash's /dev/tcp asks the management port whether the realm is served.
    healthcheck:
      test:
        - CMD-SHELL
        - exec 3<>/dev/tcp/localhost/9000 && printf 'GET /auth/health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      default: {}

  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    labels:
      traefik.enable: 'false'
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    networks:
      default: {}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # The config travels as inline content: with a remote Docker host a bind mount would look
    # for the file on the server, where this tree does not exist. Compose interpolates the
    # domain into it before Caddy ever sees it.
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    # Bound to the public address by default: the validator's nginx already holds :80 on
    # loopback, and two processes cannot share a port on the same address. On a host where
    # another proxy holds :80/:443 (traefik, nginx), CADDY_HTTP_BIND puts Caddy on loopback and
    # that proxy forwards the domain to it; CADDY_SITE is then `http://<domain>`, since the
    # proxy in front terminates TLS.
    ports:
      - '${CADDY_HTTP_BIND:-${PUBLIC_IP:?set in the env file}:80}:80'
      - '${CADDY_HTTPS_BIND:-${PUBLIC_IP:?set in the env file}:443}:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default: {}
      # Where a traefik lives (PROXY_NETWORK), Caddy joins it and these labels route the domain.
      proxy: {}
    labels:
      traefik.enable: '${TRAEFIK:-false}'
      traefik.docker.network: '${PROXY_NETWORK:-syncvotes-proxy}'
      traefik.http.routers.syncvotes.rule: 'Host(`${APP_DOMAIN}`)'
      traefik.http.routers.syncvotes.entrypoints: websecure
      traefik.http.routers.syncvotes.tls.certresolver: myresolver
      traefik.http.routers.syncvotes-http.rule: 'Host(`${APP_DOMAIN}`)'
      traefik.http.routers.syncvotes-http.entrypoints: web
      traefik.http.services.syncvotes.loadbalancer.server.port: '80'
    depends_on:
      - app

configs:
  caddyfile:
    # One public domain. The ledger API and the validator's admin UIs stay off the internet —
    # the bundle already binds them to loopback, so nothing here exposes them.
    # The client's address is worked out here, not in the app: Cloudflare's edges are the only
    # proxies trusted to say who is behind them (its published ranges), so a request that reaches
    # this origin directly is known by the address it came from, whatever headers it carries.
    content: |
      {
        servers {
          trusted_proxies static ${CADDY_TRUSTED_EXTRA:-} 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
          client_ip_headers Cf-Connecting-Ip X-Forwarded-For
        }
      }
      ${CADDY_SITE:-${APP_DOMAIN:?set in the env file}} {
        header Strict-Transport-Security "max-age=31536000; includeSubDomains"
        handle /auth/* {
          reverse_proxy keycloak:8080
        }
        handle {
          # A deploy replaces the app container: requests wait for the new one (it serves once
          # its ledger copy is built) instead of failing while it starts.
          reverse_proxy app:3000 {
            header_up X-Client-Ip {client_ip}
            lb_try_duration 60s
            lb_try_interval 1s
          }
        }
      }

volumes:
  caddy-data:
  caddy-config:
  keycloak-db:

networks:
  default:
    name: ${VALIDATOR_NETWORK:-splice-validator_default}
    external: true
  # Where a traefik routes the domain (Hetzner), the network it watches; a scratch bridge elsewhere.
  proxy:
    name: ${PROXY_NETWORK:-syncvotes-proxy}
    external: ${PROXY_NETWORK_EXTERNAL:-false}
