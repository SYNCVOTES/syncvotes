packages:
  - 'daml.js/*'

# `@daml.js/model` is generated by `daml:codegen`, so on a fresh clone the dependency package.json
# declares does not exist yet. pnpm's pre-run check would refuse to run any script — including the
# one that generates it — leaving no way in. Turning it off is what makes `pnpm daml:codegen` work
# before the first `pnpm i`.
verifyDepsBeforeRun: false

allowBuilds:
  better-sqlite3: true
  cbor-extract: true
  esbuild: true
  secp256k1: true

minimumReleaseAgeExclude:
  - '@canton-network/dapp-sdk@1.6.0'
