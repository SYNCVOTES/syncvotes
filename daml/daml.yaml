sdk-version: 3.5.7
name: syncvotes
source: src
version: 1.0.0
# The package is a lineage: its name stays, and every release after this one is a Smart
# Contract Upgrade of the one before, checked by the compiler against it with
# `upgrades: upgrades/syncvotes-<previous>.dar` (keep that DAR in upgrades/).
dependencies:
  - daml-prim
  - daml-stdlib
# The featured app interface (CIP-0047 activity markers), as the Splice release ships it.
data-dependencies:
  - lib/splice-api-featured-app-v1-1.0.0.dar
